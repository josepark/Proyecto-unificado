name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inventario-backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-inventario-secret-key-for-tests-only
      JWT_SHARED_SECRET: ci-inventario-jwt-secret-for-tests-only
    defaults:
      run:
        working-directory: plataforma/inventario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plataforma/inventario/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test

  rbac-backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      SUIIN_RBAC_SECRET: ci-rbac-secret-key-for-tests-only
    defaults:
      run:
        working-directory: plataforma/rbac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            plataforma/rbac/requirements.txt
            plataforma/rbac/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  riesgos-backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      RIESGOS_SECRET_KEY: ci-riesgos-secret-key-for-tests-only
      JWT_SHARED_SECRET: ci-riesgos-jwt-secret-for-tests-only
    defaults:
      run:
        working-directory: plataforma/riesgos/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plataforma/riesgos/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend-inventario:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plataforma/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-riesgos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma/riesgos/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plataforma/riesgos/frontend/package-lock.json
      - run: npm ci
      - run: npm test

# Gateway único de la Plataforma SUIIN-SGSI
# ==========================================
# Unifica las aplicaciones bajo un solo dominio/puerto:
#   - Frontend unificado (React)           -> "/"       (Inventario + RBAC + shell)
#   - Inventario de Activos SGSI (Django)  -> "/api/", "/login/", "/admin/", …
#   - Matriz RBAC / MCA-001 (Flask, solo API JSON) -> "/rbac/api/"
#   - Gestión de Riesgos (Django API + React nativo en SPA) -> "/gestion-riesgos/"
#     (API en "/riesgos/api/"; "/riesgos/" redirige a la SPA unificada)
#
# SUIIN-RBAC no tiene inicio de sesión propio. nginx expone solo /rbac/api/
# (protegida con auth_request contra el Inventario). Las pantallas del módulo
# viven en la SPA de React (/rbac/…).

upstream inventario_up {
    server inventario:8000;
}

upstream rbac_up {
    server rbac:5000;
}

upstream riesgos_up {
    server riesgos-backend:8000;
}

# Endurecimiento del login (sección 8.9 del README): límite de solicitudes
# a /login/ por IP, en capas junto con django-axes (que bloquea por
# usuario+IP tras repetidos fallos). zone=10m alcanza para ~160.000 IPs
# distintas en seguimiento simultáneo — de sobra para este despliegue.
# Comparten cupo /api/auth/login/, /riesgos/api/auth/login/ y /api/token-jwt/ — a
# propósito: es el mismo presupuesto total de intentos de credenciales por IP
# entre las tres puertas de entrada, no un cupo aparte por cada una. 10r/m con
# burst=6 (antes 5r/m burst=3) porque el login unificado de riesgos manda DOS
# peticiones POST por cada intento humano (primero prueba el JWT del
# Inventario, si falla cae al login propio) — con el valor anterior, un
# puñado de intentos legítimos (o solo cargar /riesgos/ un par de veces)
# alcanzaba a agotar el cupo antes de que la persona lograra entrar.
#
# GET no cuenta para este cupo (mapa de abajo): en las tres rutas, un GET es
# "ver el formulario" o "chequeo pasivo de sesión" (/api/token-jwt/, disparado
# solo, sin acción del usuario, cada vez que carga /riesgos/) — no adivina
# ninguna contraseña, así que no tiene sentido que consuma el mismo cupo que
# un POST con credenciales. Clave vacía = nginx no aplica el límite a esa
# solicitud (comportamiento documentado de limit_req_zone).
map $request_method $login_limit_key {
    default       $binary_remote_addr;
    GET           "";
}
limit_req_zone $login_limit_key zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    # --- Subpetición interna de autorización (no accesible desde fuera) ---
    location = /internal/auth-rbac {
        internal;
        proxy_pass http://inventario_up/api/auth-rbac/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- API JSON de RBAC (React/fetch) — protegida por auth_request.
    location /rbac/api/ {
        auth_request /internal/auth-rbac;
        auth_request_set $usuario_sgsi $upstream_http_x_usuario_autorizado;

        proxy_pass http://rbac_up/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /rbac;
        proxy_set_header X-Usuario-SGSI $usuario_sgsi;
    }

    # --- Health check propio de nginx (para docker-compose healthcheck) ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Frontend de React (interfaz principal, Fase 4 — README sección 9.7) ---
    # Marcadores antiguos bajo /app/ redirigen a la raíz (misma ruta sin prefijo).
    location ~ ^/app(?:/(.*))?$ {
        return 301 /$1;
    }

    # --- Login JSON de la SPA (endurecido con rate limiting; ver django-axes) ---
    location /api/auth/login/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Inventario: API REST (Django DRF) ---
    location /api/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Inventario: panel de administración Django ---
    location /admin/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Cierre de sesión del Inventario ---
    location /logout/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SUIIN-SGSI-RIESGOS: API (Django REST). La sesión única por JWT (ver
    # README-DESPLIEGUE.md sección 11.4bis) verifica localmente sin auth_request
    # contra el inventario; el login propio de riesgos (más abajo) es el respaldo
    # para cuando este módulo corre de forma independiente. ---
    location /riesgos/api/ {
        proxy_pass http://riesgos_up/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Login propio de riesgos (endurecido con rate limiting, además del
    # bloqueo por usuario+IP de django-axes en el backend — ver settings.py de
    # riesgos). Va antes que el bloque genérico /riesgos/api/ de arriba en este
    # archivo por claridad, pero el orden no importa para nginx: siempre gana
    # el location con el prefijo más específico, y /riesgos/api/auth/login/ lo
    # es más que /riesgos/api/. ---
    location /riesgos/api/auth/login/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://riesgos_up/api/auth/login/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SUIIN-SGSI-RIESGOS: panel de administración de Django y adjuntos de
    # evidencia subidos por los usuarios (Evidencia.archivo) ---
    location /riesgos/admin/ {
        proxy_pass http://riesgos_up/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /riesgos/media/ {
        proxy_pass http://riesgos_up/media/;
        proxy_set_header Host $host;
    }

    # --- SUIIN-SGSI-RIESGOS: rutas legacy /riesgos/ (SPA aparte retirada, §9.13) ---
    location = /riesgos {
        return 301 /gestion-riesgos/;
    }
    location /riesgos/ {
        rewrite ^/riesgos/?(.*)$ /gestion-riesgos/$1 permanent;
    }

    # --- Emisión de JWT de sesión única (ver README-DESPLIEGUE.md 11.4bis).
    # GET (chequeo pasivo por cookie) queda exento del límite por el mapa de
    # arriba; POST (usuario/clave) sí es un intento de credenciales real y
    # comparte el mismo cupo que /api/auth/login/. ---
    location /api/token-jwt/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Estáticos y media del inventario, servidos directamente por nginx ---
    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
    }

    # --- Frontend unificado (React SPA): rutas de la app (p. ej. /inventario,
    # /rbac/matriz) caen a index.html; React Router decide qué mostrar. ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

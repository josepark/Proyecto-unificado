# Gateway único de la Plataforma SUIIN-SGSI (HTTP — desarrollo / VLAN sin TLS)
# Para HTTPS con certificados propios: ./scripts/activar-tls.sh
# Ver README-DESPLIEGUE.md sección 6.

include /etc/nginx/includes/suiin-common.conf;

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    include /etc/nginx/includes/suiin-locations.conf;
}

    # --- Subpetición interna de autorización (no accesible desde fuera) ---
    location = /internal/auth-rbac {
        internal;
        proxy_pass http://inventario_up/api/auth-rbac/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location /rbac/api/ {
        auth_request /internal/auth-rbac;
        auth_request_set $usuario_sgsi $upstream_http_x_usuario_autorizado;
        auth_request_set $espacio_datos $upstream_http_x_espacio_datos;

        proxy_pass http://rbac_up/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /rbac;
        proxy_set_header X-Usuario-SGSI $usuario_sgsi;
        proxy_set_header X-Espacio-Datos $espacio_datos;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/app(?:/(.*))?$ {
        return 301 /$1;
    }

    location /api/auth/login/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout/ {
        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /riesgos/api/ {
        proxy_pass http://riesgos_up/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /riesgos/api/auth/login/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://riesgos_up/api/auth/login/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /riesgos/admin/ {
        proxy_pass http://riesgos_up/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /riesgos/media/ {
        proxy_pass http://riesgos_up/media/;
        proxy_set_header Host $host;
    }

    location = /riesgos {
        return 301 /gestion-riesgos/;
    }
    location /riesgos/ {
        rewrite ^/riesgos/?(.*)$ /gestion-riesgos/$1 permanent;
    }

    location /api/token-jwt/ {
        limit_req zone=login_limit burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://inventario_up;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
